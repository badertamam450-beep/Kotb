name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build Debug and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMfazah-Book-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release & Attach APK (on tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            📖 **تطبيق كتاب إلى المفازة العظمى**
            ✍️ إعداد وتأليف: د. مالك عبدالرحمن الرميمة

            - إصدار جاهز للتثبيت المباشر على جميع هواتف أندرويد.
            - يحتوي على تصحيح لغوي وإملائي شامل لكافة صفحات الكتاب.
            - قارئ صوتي وفهرس ذكي ودعم لمختلف السمات المظهرية.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
